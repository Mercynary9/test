<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="Sky Stomp — a 3D jump platformer for phones, with chasing, shooting and spiked enemies." />
<title>Sky Stomp — 3D Platformer for Phones</title>
<link rel="stylesheet" href="./styles.css" />
<!-- Inline so the page makes no extra request (and no 404) for an icon. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2363d2ff'/%3E%3Ccircle cx='11' cy='13' r='3' fill='%23fff'/%3E%3Ccircle cx='21' cy='13' r='3' fill='%23fff'/%3E%3C/svg%3E" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-card" id="hearts-card">
        <div id="hearts" class="hearts"></div>
      </div>
      <div class="hud-card stats">
        <span class="stat"><b id="coins">0</b><span class="label">coins</span></span>
        <span class="stat"><b id="enemies-left">0</b><span class="label">left</span></span>
        <span class="stat"><b id="deaths">0</b><span class="label">falls</span></span>
      </div>
      <div class="hud-buttons">
        <button id="btn-restart" class="icon-btn" type="button" aria-label="Restart level">⟲</button>
        <button id="btn-pause" class="icon-btn" type="button" aria-label="Pause">⏸</button>
      </div>
    </div>
    <div class="hud-level"><span id="level-name">—</span></div>
    <div id="toast" class="toast"></div>
    <div id="hint" class="hud-hint"></div>
  </div>

  <!-- On-screen controls. Every child carries data-control, which is how
       touch.js decides what a thumb landed on. -->
  <div id="touch" class="touch hidden">
    <div class="zone zone-look" data-control="look"></div>
    <div class="zone zone-stick" data-control="stick"></div>
    <div class="stick-base"><div class="stick-knob"></div></div>
    <button class="tbtn dash" data-control="dash" type="button" tabindex="-1">DASH</button>
    <button class="tbtn jump" data-control="jump" type="button" tabindex="-1">JUMP</button>
  </div>

  <div id="overlay" class="overlay">
    <div class="panel">
      <h1>Sky Stomp</h1>
      <p class="sub">A 3D jump platformer made for phones.</p>
      <div id="overlay-body"></div>
      <button id="overlay-btn" class="btn" type="button">Start</button>
      <p class="tiny" id="overlay-tip">Best played with the phone held in two hands.</p>
    </div>
  </div>

  <div id="loading" class="overlay">
    <div class="panel"><h1>Loading…</h1><p class="sub">Fetching three.js</p></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
